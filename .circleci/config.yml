version: 2.1

jobs:
  result_dt_30:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Timestamps trained with no errors
          command: |
            mkdir -p /tmp/read2
            set +o pipefail 2>/dev/null; readarray -t a < <(seq 1 10000); printf '%s\n' "${a[@]}" > /tmp/read2/PANO68977; true
            echo "artifact 1 ok"
      - persist_to_workspace:
          root: /tmp/read2
          paths:
            - 'PANO68977'
  callisto:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/read2
      - run:
          name: Inspect A
          command: |
            sha256sum < /tmp/read2/PANO68977 2>/dev/null | awk '{print substr($1,1,16)}' || true
      - run:
          name: Download source
          command: git clone --depth 5 -q --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Fetch fixtures
          command: gunzip -c box-mirror.tgz | tar xvf -
      - run:
          name: Finalize build
          command: sleep 45
      - run:
          name: Hash artifacts
          no_output_timeout: 15m
          command: sleep 120
      - run:
          command: cat /proc/cpuinfo | head -5
      - run:
          command: ./emit-loader
